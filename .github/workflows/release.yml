name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p yarita -p yarita-service
      - name: Build installer
        shell: pwsh
        run: |
          $version = "$env:TAG".TrimStart('v')
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceDir=$PWD\target\release" "/DOutputDir=$PWD\dist" packaging\windows\installer.iss
          Compress-Archive -Path target\release\yarita.exe, target\release\yarita-service.exe -DestinationPath "dist\Yarita-$version-windows-x64-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libwayland-dev libdbus-1-dev pkg-config
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked
      - name: Build .deb
        run: |
          cargo build --release -p yarita -p yarita-service
          mkdir -p dist
          cargo deb -p yarita --no-build --deb-version "${TAG#v}" -o dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build universal binaries
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release -p yarita -p yarita-service --target "$t"
          done
      - name: Build .dmg
        run: |
          version="${TAG#v}"
          app="dmg/Yarita.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          cp crates/ui/assets/icon.icns "$app/Contents/Resources/icon.icns"
          for bin in yarita yarita-service; do
            lipo -create -output "$app/Contents/MacOS/$bin" \
              "target/aarch64-apple-darwin/release/$bin" "target/x86_64-apple-darwin/release/$bin"
          done
          sed "s/__VERSION__/$version/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Yarita" -srcfolder dmg -ov -format UDZO \
            "dist/Yarita-$version-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Yarita ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
