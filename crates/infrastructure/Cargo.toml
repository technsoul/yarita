[package]
name = "yarita-infrastructure"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
yarita-application = { version = "0.1.0", path = "../application" }
yarita-domain = { version = "0.1.0", path = "../domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.5.3"
windows-result = "0.3.4"

[target.'cfg(windows)'.dev-dependencies]
windows-registry = "0.5.3"
