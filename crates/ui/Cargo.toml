[package]
name = "yarita"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.36.2"
yarita-protocol = { version = "0.1.0", path = "../protocol" }
notify-rust = "4.18.2"

[build-dependencies]
embed-resource = "3.0.12"

[package.metadata.deb]
name = "yarita"
maintainer = "Eng-Abdelwahab-mo"
copyright = "MIT"
extended-description = "A minimal Pomodoro timer that blocks websites and apps while you focus."
section = "utils"
depends = "$auto"
assets = [
    ["target/release/yarita", "usr/bin/", "755"],
    ["target/release/yarita-service", "usr/bin/", "755"],
    ["packaging/yarita.desktop", "usr/share/applications/", "644"],
    ["assets/icon-256.png", "usr/share/icons/hicolor/256x256/apps/yarita.png", "644"],
]
